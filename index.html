<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Games</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎮</text></svg>">
<style>
:root{--bg:#eef3f7;--fg:#13202b;--card:#ffffff;--bd:#c9d5e0;--ac:#2f80ed;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1720;--fg:#e8eef3;--card:#1b2631;--bd:#33465a}}
:root[data-theme="dark"]{--bg:#0f1720;--fg:#e8eef3;--card:#1b2631;--bd:#33465a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,sans-serif;min-height:100vh}
header{padding:36px 20px 8px;text-align:center}
h1{margin:0;font-size:38px;letter-spacing:-.5px}
header p{margin:6px 0 0;opacity:.7}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px;padding:20px;max-width:900px;margin:0 auto}
a.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:22px;transition:transform .15s,border-color .15s}
a.card:hover,a.card:focus{transform:translateY(-3px);border-color:var(--ac)}
.ic{font-size:52px;line-height:1}
.t{font-size:22px;font-weight:700;margin:12px 0 4px}
.d{opacity:.7;font-size:15px;line-height:1.4}
.tag{display:inline-block;margin-top:12px;font-size:13px;padding:4px 10px;border-radius:99px;background:var(--ac);color:#fff}
footer{text-align:center;opacity:.5;font-size:13px;padding:24px}
</style></head>
<body>
<header><h1>🎮 Smart Games</h1><p>Brauzerda o’ynaladigan o’yinlar</p></header>
<main>
<a class="card" href="futbol.html">
<div class="ic">⚽</div>
<div class="t">Bosh to’p futbol</div>
<div class="d">8 bosqich, turli stadionlar, telefon joystik va televizor rejimi.</div>
<span class="tag">O’ynash</span>
</a>
</main>
<footer>Yangi o’yinlar qo’shilib boriladi</footer>
</body></html>
