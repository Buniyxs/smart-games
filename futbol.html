function menuStep(){

    return}

function step(){

  for(let i=pts.length-1;i>=0;i--){const q=pts[i];q.x+=q.vx;q.y+=q.vy;q.vy+=q.g?.25:.1;q.vx*=.98;if(--q.l<=0)pts.splice(i,1)}

function hgtT(c,v){if(!c)return 0;const q=(m,sg)=>Math.exp(-Math.pow((v-m)/sg,2));
  return c===1?52*q(W/2,110):c===2?-44*q(W/2,130):38*(q(W/3,70)+q(W*2/3,70))}
const gy=v=>G-hgtT(S.tr,v);
const plat=()=>S.pl?[W/2-110,W/2+110,G-215]:null;

  if(msg==='GOL!'&&pause>0){x.fillStyle='rgba(255,255,255,.9)';for(let i=0;i<24;i++){if(Math.random()<.5)continue;x.beginPath();x.arc(60+Math.random()*(W-120),160+Math.random()*130,2+Math.random()*3,0,7);x.fill()}}

    else if(f==='rain'){const px=(((i*131-n*90)%W)+W)%W,py=((i*71)%H+n*620)%H;x.beginPath();x.moveTo(px,py);x.lineTo(px-4,py+16);x.stroke()}
    else{const px=((i*131)%W+n*(260+i%4*40))%W,py=(i*47)%H;x.beginPath();x.moveTo(px,py);x.lineTo(px-22,py+1);x.stroke()}}
}
let AC=null,NBUF=null,CG=null,mute=false;
try{mute=localStorage.getItem('bt-mute')==='1'}catch(e){}
function aud(){if(AC)return AC;try{AC=new(window.AudioContext||window.webkitAudioContext)();
  NBUF=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate);const d=NBUF.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  const sr=AC.createBufferSource();sr.buffer=NBUF;sr.loop=true;const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=420;
  CG=AC.createGain();CG.gain.value=mute?0:.05;sr.connect(fl);fl.connect(CG);CG.connect(AC.destination);sr.start()}catch(e){AC=null}return AC}
function tone(f,d,ty,v,sl,dl){const a=aud();if(!a||mute)return;const t0=a.currentTime+(dl||0),o=a.createOscillator(),g=a.createGain();
  o.type=ty;o.frequency.setValueAtTime(f,t0);if(sl)o.frequency.exponentialRampToValueAtTime(sl,t0+d);
  g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+d+.02)}
function noise(d,v,f,ty){const a=aud();if(!a||mute)return;const t0=a.currentTime,sr=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain();
  sr.buffer=NBUF;fl.type=ty;fl.frequency.value=f;g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.001,t0+d);
  sr.connect(fl);fl.connect(g);g.connect(a.destination);sr.start(t0,Math.random());sr.stop(t0+d+.02)}
function sfx(n,v){v=v||1;
  if(n==='kick'){noise(.09,.5,1200,'lowpass');tone(150,.12,'sine',.6,55)}
  else if(n==='head')tone(230,.09,'triangle',.4,120);
  else if(n==='bounce')tone(130,.09,'sine',Math.min(.4,.2+v*.2),70);
  else if(n==='jump')tone(320,.1,'square',.04,640);
  else if(n==='tick')tone(520,.05,'square',.05);
  else if(n==='ok')tone(700,.08,'square',.07,1200);
  else if(n==='whistle'){tone(2300,.18,'sine',.12);tone(2300,.3,'sine',.12,2500,.22)}
  else if(n==='goal'){noise(1.6,.5,900,'bandpass');tone(2300,.5,'sine',.12);[392,494,587,784].forEach((f,i)=>tone(f,.25,'triangle',.18,0,.1+i*.12));
    if(CG&&!mute){CG.gain.setTargetAtTime(.16,AC.currentTime,.05);CG.gain.setTargetAtTime(.05,AC.currentTime+1.2,.5)}}
  else if(n==='win'){[523,659,784,1047].forEach((f,i)=>tone(f,.3,'triangle',.2,0,i*.15));sfx('whistle')}

}
function fit(){

  const nw=Math.round(Math.min(1300,Math.max(760,H*r.width/r.height))),nd=Math.min(2,window.devicePixelRatio||1);

}
function shoe(sx,sy,col,a){x.globalAlpha=a;el(sx,sy+6,16,5,'#111');el(sx,sy,15,9,col);el(sx+2,sy-3,8,3,'rgba(255,255,255,.35)');x.globalAlpha=1}
function person(p,al){

  let gr=x.createRadialGradient(px-d*8,py-14,4,px,py,r);gr.addColorStop(0,'#fff');gr.addColorStop(.25,p.skin);gr.addColorStop(1,'rgba(0,0,0,.35)');
  x.fillStyle=p.skin;x.beginPath();x.arc(px,py,r,0,7);x.fill();

  x.save();x.beginPath();x.arc(px,py,r,0,7);x.clip();x.fillStyle=p.col;x.fillRect(px-r,py-r,2*r,r-12);x.fillStyle='rgba(255,255,255,.25)';x.fillRect(px-r,py-r,2*r,5);x.restore();
  el(px+d*(r-6),py-12,17,5,'rgba(0,0,0,.45)');el(px+d*(r-6),py-13,17,5,p.col);
  el(px+d*(r-2),py+6,5,5,'rgba(0,0,0,.18)');
  const ang=Math.atan2((B.y)-py,(B.x)-px);
  for(const ox of [10,26]){
    const ex=px+d*ox,ey=py-2;
    el(ex,ey,8,10,'#fff');x.strokeStyle='rgba(0,0,0,.35)';x.lineWidth=1;x.beginPath();x.ellipse(ex,ey,8,10,0,0,7);x.stroke();
    el(ex+Math.cos(ang)*3.5,ey+Math.sin(ang)*4.5,4.6,4.6,'#111');el(ex+Math.cos(ang)*3.5+1.5,ey+Math.sin(ang)*4.5-1.5,1.5,1.5,'#fff');
    x.strokeStyle='#2a1a10';x.lineWidth=3;x.lineCap='round';x.beginPath();x.moveTo(ex-7,ey-15-d*2);x.lineTo(ex+7,ey-15+d*2);x.stroke();
  }
  const happy=pause>0||p.k>0;
  x.strokeStyle='#5a1f1f';x.lineWidth=2.5;
  if(happy){el(px+d*16,py+16,7,6,'#7a1f1f');el(px+d*16,py+13,6,2.5,'#fff')}
  else{x.beginPath();x.arc(px+d*16,py+10,9,.15*Math.PI,.85*Math.PI);x.stroke()}
  x.strokeStyle='rgba(0,0,0,.3)';x.lineWidth=2;x.beginPath();x.arc(px,py,r,0,7);x.stroke();
}
function drawBall(al){
  const bx=B.px+(B.x-B.px)*al,by=B.py+(B.y-B.py)*al,h=Math.max(0,gy(bx)-by);
  el(bx,gy(bx)+8,B.r*(1-h/500),6,'rgba(0,0,0,'+(.3-h/1200)+')');

}
